<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Блог</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
  :root {
    --accent: #6ee7b7;
    --accent2: #34d399;
    --accent-rgb: 110, 231, 183;
    --text: #e6f2ec;
    --muted: #93a89c;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.11);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: #0a0d10;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- static gradient background ---------- */
  .bg-scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
  }
  .blob-1 {
    width: 70vmax; height: 70vmax;
    top: -30vmax; left: -25vmax;
    background: radial-gradient(circle at center,
      rgba(28,249,54,0.28) 0%,
      rgba(9,83,63,0.32) 25%,
      rgba(37,136,32,0.16) 50%,
      transparent 72%);
  }
  .blob-2 {
    width: 60vmax; height: 60vmax;
    bottom: -28vmax; right: -22vmax;
    background: radial-gradient(circle at center,
      rgba(186,178,12,0.24) 0%,
      rgba(37,136,32,0.26) 28%,
      rgba(9,83,63,0.14) 55%,
      transparent 75%);
  }
  .blob-3 {
    width: 50vmax; height: 50vmax;
    top: 25%; left: 35%;
    background: radial-gradient(circle at center,
      rgba(28,249,54,0.14) 0%,
      rgba(9,83,63,0.2) 30%,
      transparent 70%);
  }

  .container { max-width: 860px; margin: 0 auto; padding: 60px 20px 80px; }

  /* ---------- header ---------- */
  header { text-align: center; margin-bottom: 48px; }
  .site-title {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(120deg, var(--accent), var(--accent2), var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 6s linear infinite, fadeDown 0.8s ease both;
    filter: drop-shadow(0 4px 24px rgba(var(--accent-rgb), 0.28));
  }
  @keyframes gradientShift { to { background-position: 200% center; } }
  .site-subtitle { color: var(--muted); margin-top: 10px; animation: fadeDown 0.8s 0.15s ease both; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }

  /* ---------- post cards ---------- */
  .post-list { display: flex; flex-direction: column; gap: 22px; }
  .post-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(.22,.9,.3,1.2), box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    opacity: 0;
  }
  .post-card.visible { animation: cardIn 0.6s ease both; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  .post-card:hover {
    transform: translateY(-5px) scale(1.01);
    border-color: rgba(var(--accent-rgb), 0.55);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 14px 44px rgba(var(--accent-rgb), 0.22);
  }
  .post-card:active { transform: translateY(-1px) scale(0.99); }

  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(var(--accent-rgb), 0.35);
    transform: scale(0); pointer-events: none;
    animation: rippleAnim 0.6s ease-out forwards;
  }
  @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

  .post-header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .post-title { font-size: 1.35rem; font-weight: 700; transition: color 0.3s ease; }
  .post-card:hover .post-title { color: var(--accent); }
  .post-date {
    font-size: 0.85rem; color: var(--muted);
    background: rgba(255,255,255,0.06);
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .post-excerpt { margin-top: 12px; color: var(--muted); line-height: 1.6; }
  .read-more {
    margin-top: 14px; display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent); font-weight: 600; font-size: 0.95rem;
  }
  .read-more .arrow { transition: transform 0.3s ease; }
  .post-card:hover .arrow { transform: translateX(5px); }

  .empty, .error-msg { text-align: center; color: var(--muted); padding: 60px 0; animation: cardIn 0.5s ease both; line-height: 1.6; }
  .error-msg code {
    background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 6px;
    border: 1px solid var(--border); color: #ffe08a;
    font-family: 'Consolas', 'Fira Code', monospace; font-size: 0.9em;
  }

  .back-home {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 50px; color: var(--muted); text-decoration: none;
    transition: color 0.3s ease;
  }
  .back-home:hover { color: var(--accent); }

  footer { text-align: center; margin-top: 60px; color: var(--muted); font-size: 0.85rem; opacity: 0.7; }

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(var(--accent-rgb), 0.25);
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), 0.45); }
</style>
<base target="_blank">
</head>
<body>
<!-- static gradient background -->
<div class="bg-scene" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="container">
  <header>
    <h1 class="site-title">Ayblog</h1>
  </header>

  <div id="post-list" class="post-list"></div>
  <div id="status"></div>

  <footer>© ayonelnx · Powered by GitHub Pages</footer>
</div>

<script>
const listEl = document.getElementById('post-list');
const statusEl = document.getElementById('status');

const REPO_OWNER = 'ayonelnx';
const REPO_NAME  = 'ayonelnx.github.io';
const POSTS_PATH = 'blog/posts';

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function extractTitle(md) {
  const m = md.match(/^#\s+(.+)$/m);
  return m ? m[1].trim() : null;
}

function makeExcerpt(md, maxLen = 180) {
  if (!md) return '';
  const noTitle = md.replace(/^#\s+.+$/m, '');
  const plain = noTitle
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[.*?\]\(.*?\)/g, ' ')
    .replace(/\[(.*?)\]\(.*?\)/g, '$1')
    .replace(/[#>*`_\-]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return plain.length > maxLen ? plain.slice(0, maxLen).trimEnd() + '…' : plain;
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function loadPosts() {
  // Используем основной API содержимого
  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${POSTS_PATH}`;

  try {
    // Добавляем заголовок Accept, чтобы GitHub точно понял, что мы хотим JSON
    const response = await fetch(apiUrl, {
        headers: {
            'Accept': 'application/vnd.github.v3+json'
        }
    });

    if (!response.ok) {
        if (response.status === 404) {
            throw new Error(`Путь не найден. Проверь, существует ли папка "${POSTS_PATH}" в репозитории.`);
        } else if (response.status === 403) {
            throw new Error('Превышен лимит запросов GitHub API. Подожди час или используй токен.');
        } else {
            throw new Error(`Ошибка API: ${response.status}`);
        }
    }

    const files = await response.json();

    // Фильтруем только markdown файлы
    const mdFiles = files.filter(f => f.type === 'file' && f.name.endsWith('.md'));

    if (mdFiles.length === 0) {
       statusEl.innerHTML = '<div class="empty">В папке нет файлов .md</div>';
       return;
    }

    // Сортируем по имени (если в имени дата YYYY-MM-DD, новые будут сверху)
    mdFiles.sort((a, b) => b.name.localeCompare(a.name));

    mdFiles.forEach((file, index) => {
        const slug = file.name.replace(/\.md$/i, '');
        // Извлекаем дату из имени файла, если она там есть
        const dateMatch = file.name.match(/(\d{4}-\d{2}-\d{2})/);
        const dateISO = dateMatch ? dateMatch[1] : null;

        // Создаем карточку сразу
        const card = document.createElement('a');
        card.className = 'post-card';
        card.href = `post.html?p=${encodeURIComponent(slug)}`;

        // Временный контент
        card.innerHTML = `
          <div class="post-header">
            ${dateISO ? `<span class="post-date">${formatDate(dateISO)}</span>` : ''}
            <h2 class="post-title">${escapeHtml(slug.replace(/-/g, ' '))}</h2>
          </div>
          <p class="post-excerpt">Загрузка...</p>
          <span class="read-more">Читать далее <span class="arrow">→</span></span>`;

        // Анимация появления
        setTimeout(() => card.classList.add('visible'), 50 * index);

        // Эффект клика
        card.addEventListener('click', function(e) {
            const rect = card.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            card.appendChild(ripple);
            setTimeout(() => ripple.remove(), 650);
        });

        listEl.appendChild(card);

        // Загружаем текст поста фоном с raw.githubusercontent.com
        // Это быстрее и не тратит лимиты API так сильно
        const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${POSTS_PATH}/${file.name}`;

        fetch(rawUrl)
            .then(res => {
                if (!res.ok) throw new Error('Raw fetch failed');
                return res.text();
            })
            .then(text => {
                const title = extractTitle(text);
                const excerpt = makeExcerpt(text);

                if (title) card.querySelector('.post-title').textContent = title;
                card.querySelector('.post-excerpt').textContent = excerpt || 'Нет описания';
            })
            .catch(err => {
                // Если ветка main не найдена, пробуем master
                const rawUrlMaster = rawUrl.replace('/main/', '/master/');
                fetch(rawUrlMaster)
                    .then(res => res.text())
                    .then(text => {
                        const title = extractTitle(text);
                        const excerpt = makeExcerpt(text);
                        if (title) card.querySelector('.post-title').textContent = title;
                        card.querySelector('.post-excerpt').textContent = excerpt || 'Нет описания';
                    })
                    .catch(() => {
                        card.querySelector('.post-excerpt').textContent = "Ошибка загрузки текста";
                    });
            });
    });

  } catch (error) {
    console.error(error);
    statusEl.innerHTML = `
        <div class="error-msg">
            <strong>Не удалось загрузить посты.</strong><br>
            ${error.message}<br><br>
            <small>Убедись, что:</small><br>
            <small>1. Репозиторий публичный.</small><br>
            <small>2. Папка <code>${POSTS_PATH}</code> существует.</small><br>
            <small>3. Ты открыл сайт через HTTPS (GitHub Pages), а не как файл.</small>
        </div>`;
  }
}

loadPosts();
</script>
</body>
</html>
