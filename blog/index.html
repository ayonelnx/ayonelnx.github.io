<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayblog | NixOS & Linux</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=JetBrains+Mono:wght@400;500&display=swap');
  
  :root {
    --accent: #6ee7b7;
    --accent-glow: rgba(110, 231, 183, 0.15);
    --text: #e6f2ec;
    --text-secondary: #93a89c;
    --bg: #0a0d10;
    --card-bg: rgba(20, 25, 30, 0.6);
    --card-border: rgba(255, 255, 255, 0.08);
    --radius: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Google Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* Фоновые градиенты */
  .ambient-light {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: 
      radial-gradient(circle at 15% 30%, rgba(110, 231, 183, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(52, 211, 153, 0.06) 0%, transparent 40%);
  }

  .container { max-width: 800px; margin: 0 auto; padding: 80px 24px; }

  /* Шапка */
  header { text-align: center; margin-bottom: 60px; animation: fadeDown 0.8s ease both; }
  .logo {
    font-size: clamp(2.5rem, 5vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .subtitle { color: var(--text-secondary); font-size: 1.1rem; }

  /* Список постов */
  .post-list { display: flex; flex-direction: column; gap: 20px; }
  
  .post-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 28px 32px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    opacity: 0; transform: translateY(20px);
    position: relative; overflow: hidden;
  }
  
  .post-card.visible { opacity: 1; transform: translateY(0); }
  
  .post-card:hover {
    transform: translateY(-4px);
    border-color: rgba(110, 231, 183, 0.3);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
    background: rgba(30, 38, 45, 0.7);
  }

  .meta-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  
  .date-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    background: rgba(110, 231, 183, 0.1);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(110, 231, 183, 0.2);
  }

  .post-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
    transition: color 0.2s;
  }
  .post-card:hover .post-title { color: var(--accent); }

  .excerpt {
    color: var(--text-secondary);
    font-size: 0.95rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .read-indicator {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    opacity: 0.8; transition: opacity 0.2s;
  }
  .post-card:hover .read-indicator { opacity: 1; }

  /* Статусы и ошибки */
  .status-msg {
    text-align: center; padding: 60px 20px;
    color: var(--text-secondary);
    animation: fadeDown 0.5s ease both;
  }
  .status-msg code {
    background: rgba(255,255,255,0.05);
    padding: 2px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
  }

  footer {
    text-align: center; margin-top: 80px; padding-top: 40px;
    border-top: 1px solid var(--card-border);
    color: var(--text-secondary); font-size: 0.85rem;
  }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
</style>
<base target="_blank">
</head>
<body>

<div class="ambient-light"></div>

<div class="container">
  <header>
    <h1 class="logo">Ayblog</h1>
    <p class="subtitle">Заметки о Linux, NixOS и жизни без фризов</p>
  </header>

  <div id="post-list" class="post-list"></div>
  <div id="status"></div>

  <footer>
    © 2026 ayonelnx · Built with raw GitHub API
  </footer>
</div>

<script>
const listEl = document.getElementById('post-list');
const statusEl = document.getElementById('status');

// КОНФИГУРАЦИЯ
const CONFIG = {
  owner: 'ayonelnx',
  repo: 'ayonelnx.github.io',
  // Скрипт сам попробует эти пути по порядку
  pathsToTry: ['blog/posts', 'blog', 'posts', ''], 
  branch: 'main' // Если не работает, скрипт сам попробует 'master'
};

// Утилиты
const escapeHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const extractTitle = md => { const m = md.match(/^#\s+(.+)$/m); return m ? m[1].trim() : null; };
const makeExcerpt = (md, len=160) => {
  if(!md) return '';
  const clean = md.replace(/^#\s+.+$/m,'').replace(/```[\s\S]*?```/g,'').replace(/!\[.*?\]\(.*?\)/g,'')
    .replace(/\[(.*?)\]\(.*?\)/g,'$1').replace(/[#>*`_\-]+/g,' ').replace(/\s+/g,' ').trim();
  return clean.length > len ? clean.slice(0,len)+'…' : clean;
};
const fmtDate = iso => new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});

async function fetchJson(url) {
  const r = await fetch(url, {headers:{'Accept':'application/vnd.github.v3+json'}});
  return r.ok ? r.json() : null;
}

async function loadPosts() {
  statusEl.innerHTML = '<div class="status-msg">Поиск постов в репозитории...</div>';
  
  let files = null, usedPath = '';
  
  // 1. Ищем правильную папку
  for (const path of CONFIG.pathsToTry) {
    const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;
    const data = await fetchJson(url);
    if (data && Array.isArray(data)) {
      files = data.filter(f => f.type === 'file' && f.name.endsWith('.md'));
      if (files.length > 0) { usedPath = path; break; }
    }
  }

  // 2. Обработка отсутствия файлов
  if (!files || files.length === 0) {
    statusEl.innerHTML = `
      <div class="status-msg">
        Посты не найдены.<br>
        Убедись, что в репозитории есть <code>.md</code> файлы в папке <code>blog/posts</code> или <code>blog</code>.<br>
        <small style="opacity:0.6">Проверь консоль (F12) для отладки.</small>
      </div>`;
    console.log('Доступные пути для проверки:', CONFIG.pathsToTry);
    return;
  }

  statusEl.innerHTML = '';
  files.sort((a,b) => b.name.localeCompare(a.name));

  // 3. Рендер карточек
  files.forEach((file, i) => {
    const slug = file.name.replace(/\.md$/i,'');
    const dateMatch = file.name.match(/(\d{4}-\d{2}-\d{2})/);
    
    const card = document.createElement('a');
    card.className = 'post-card';
    card.href = `post.html?p=${encodeURIComponent(slug)}`;
    card.style.transitionDelay = `${i * 0.05}s`;
    
    card.innerHTML = `
      <div class="meta-row">
        ${dateMatch ? `<span class="date-badge">${fmtDate(dateMatch[1])}</span>` : ''}
      </div>
      <h2 class="post-title">${escapeHtml(slug.replace(/-/g,' '))}</h2>
      <p class="excerpt">Загрузка содержания...</p>
      <div class="read-indicator">Открыть пост <span>→</span></div>
    `;

    listEl.appendChild(card);
    setTimeout(() => card.classList.add('visible'), 50);

    // 4. Загрузка текста через RAW (быстро и без лимитов)
    const tryLoadText = async (branch) => {
      const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${branch}/${usedPath}/${file.name}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('404');
        const md = await res.text();
        const title = extractTitle(md);
        const excerpt = makeExcerpt(md);
        
        if(title) card.querySelector('.post-title').textContent = title;
        card.querySelector('.excerpt').textContent = excerpt || 'Без описания';
        return true;
      } catch(e) { return false; }
    };

    // Пробуем main, если не вышло - master
    tryLoadText(CONFIG.branch).then(success => {
      if(!success) tryLoadText('master');
    });
  });
}

loadPosts();
</script>
</body>
</html>
