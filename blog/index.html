<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Блог</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
  :root {
    --accent: #6ee7b7;
    --accent2: #34d399;
    --accent-rgb: 110, 231, 183;
    --text: #e6f2ec;
    --muted: #93a89c;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.11);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: #0b0d17;
    overflow-x: hidden;
  }

  /* ---------- animated green mesh background ---------- */
  .bg-svg {
    position: fixed; inset: 0;
    z-index: -2;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-svg svg { width: 100%; height: 100%; display: block; }
  .bg-svg .sw { transform-box: fill-box; transform-origin: center; will-change: transform; }
  .bg-svg .sw1 { animation: sw1 20s ease-in-out infinite; }
  .bg-svg .sw2 { animation: sw2 24s ease-in-out infinite; }
  .bg-svg .sw3 { animation: sw3 28s ease-in-out infinite; }
  .bg-svg .sw4 { animation: sw4 22s ease-in-out infinite; }
  @keyframes sw1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(70px,-50px) scale(1.12); }
    66%      { transform: translate(-40px,60px) scale(0.93); }
  }
  @keyframes sw2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(-80px,40px) scale(1.1); }
    66%      { transform: translate(60px,-60px) scale(0.95); }
  }
  @keyframes sw3 {
    0%, 100% { transform: translate(0,0) scale(1) rotate(0deg); }
    33%      { transform: translate(60px,55px) scale(1.08) rotate(6deg); }
    66%      { transform: translate(-55px,-45px) scale(0.93) rotate(-6deg); }
  }
  @keyframes sw4 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(-65px,70px) scale(1.13); }
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(4, 12, 10, 0.42);
    backdrop-filter: blur(2px);
    z-index: -1;
  }

  .container { max-width: 860px; margin: 0 auto; padding: 60px 20px 80px; }

  /* ---------- header ---------- */
  header { text-align: center; margin-bottom: 48px; }
  .site-title {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(120deg, var(--accent), var(--accent2), var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 6s linear infinite, fadeDown 0.8s ease both;
    filter: drop-shadow(0 4px 24px rgba(var(--accent-rgb), 0.25));
  }
  @keyframes gradientShift { to { background-position: 200% center; } }
  .site-subtitle { color: var(--muted); margin-top: 10px; animation: fadeDown 0.8s 0.15s ease both; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }

  /* ---------- post cards ---------- */
  .post-list { display: flex; flex-direction: column; gap: 22px; }
  .post-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(.22,.9,.3,1.2), box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    opacity: 0;
  }
  .post-card.visible { animation: cardIn 0.6s ease both; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  .post-card:hover {
    transform: translateY(-5px) scale(1.01);
    border-color: rgba(var(--accent-rgb), 0.55);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 14px 44px rgba(var(--accent-rgb), 0.22);
  }
  .post-card:active { transform: translateY(-1px) scale(0.99); }

  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(var(--accent-rgb), 0.35);
    transform: scale(0); pointer-events: none;
    animation: rippleAnim 0.6s ease-out forwards;
  }
  @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

  .post-header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .post-title { font-size: 1.35rem; font-weight: 700; transition: color 0.3s ease; }
  .post-card:hover .post-title { color: var(--accent); }
  .post-date {
    font-size: 0.85rem; color: var(--muted);
    background: rgba(255,255,255,0.06);
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .post-excerpt { margin-top: 12px; color: var(--muted); line-height: 1.6; }
  .read-more {
    margin-top: 14px; display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent); font-weight: 600; font-size: 0.95rem;
  }
  .read-more .arrow { transition: transform 0.3s ease; }
  .post-card:hover .arrow { transform: translateX(5px); }

  .empty, .error-msg { text-align: center; color: var(--muted); padding: 60px 0; animation: cardIn 0.5s ease both; line-height: 1.6; }
  .error-msg code {
    background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 6px;
    border: 1px solid var(--border); color: #ffe08a;
    font-family: 'Consolas', 'Fira Code', monospace; font-size: 0.9em;
  }

  .back-home {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 50px; color: var(--muted); text-decoration: none;
    transition: color 0.3s ease;
  }
  .back-home:hover { color: var(--accent); }

  footer { text-align: center; margin-top: 60px; color: var(--muted); font-size: 0.85rem; opacity: 0.7; }

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(var(--accent-rgb), 0.25);
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), 0.45); }
</style>
<base target="_blank">
</head>
<body>
<!-- ===== animated green mesh background ===== -->
<div class="bg-svg" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
        <feGaussianBlur stdDeviation="168" />
      </filter>
      <filter id="noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
        <feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
      </filter>
    </defs>
    <rect id="background" width="100%" height="100%" fill="#000" />
    <g id="swatches" filter="url(#blur)">
      <rect class="sw sw1" x="201.72421208408113" y="-146.4527952344053"  width="342.921944443973"   height="582.5629641032037"  fill="#09533f" />
      <rect class="sw sw2" x="289.1231513839648"  y="133.17153406167108" width="341.3269880922901"  height="405.58624760268276" fill="#1cf936" />
      <rect class="sw sw3" x="456.6570866263271"  y="259.5834516989205"  width="415.19998894386384" height="301.29288642421477" fill="#bab20c" />
      <rect class="sw sw4" x="389.01795344038504" y="-5.556255178521042" width="361.29726427563185" height="331.62150029313995" fill="#258820" />
    </g>
    <rect x="0" y="0" width="1000" height="500" style="mix-blend-mode: luminosity; filter: url(#noise); opacity: 0%"></rect>
  </svg>
</div>

<div class="container">
  <header>
    <h1 class="site-title">Ayblog</h1>
  </header>

  <div id="post-list" class="post-list"></div>
  <div id="status"></div>

  <footer>© ayonelnx · Powered by GitHub Pages</footer>
</div>

<script>
const listEl = document.getElementById('post-list');
const statusEl = document.getElementById('status');

/* ---------- настройки репозитория ---------- */
const REPO_OWNER = 'ayonelnx';
const REPO_NAME  = 'ayonelnx.github.io';
const POSTS_PATH = 'blog/posts';   // папка с .md файлами внутри репо

/* ---------- markdown helpers ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function extractTitle(md) {
  const m = md.match(/^#\s+(.+)$/m);
  return m ? m[1].trim() : 'Без названия';
}

function makeExcerpt(md, maxLen = 180) {
  const noTitle = md.replace(/^#\s+.+$/m, '');
  const plain = noTitle
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[.*?\]\(.*?\)/g, ' ')
    .replace(/\[(.*?)\]\(.*?\)/g, '$1')
    .replace(/[#>*`_\-]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return plain.length > maxLen ? plain.slice(0, maxLen).trimEnd() + '…' : plain;
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* Достаём дату из имени файла вида 2026-10-16-some-title.md */
function extractDateFromName(name) {
  const m = name.match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : '';
}

/* ---------- загрузка списка файлов с GitHub ---------- */
async function loadPosts() {
  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${POSTS_PATH}`;

  let files;
  try {
    const r = await fetch(apiUrl, {
      cache: 'no-store',
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if (!r.ok) throw new Error('GitHub API: ' + r.status);
    const data = await r.json();

    files = data.filter(item => item.type === 'file' && /\.md$/i.test(item.name));
  } catch (e) {
    statusEl.innerHTML = '<div class="error-msg">Не удалось загрузить список постов с GitHub. Проверь путь <code>' +
      POSTS_PATH + '</code> и лимит API.</div>';
    return;
  }

  // сортировка: новейшие первыми (по имени файла)
  files.sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));

  if (!files.length) {
    statusEl.innerHTML = '<div class="empty">Пока нет постов. Добавь .md файлы в /' + POSTS_PATH + ' ✨</div>';
    return;
  }

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const slug = file.name.replace(/\.md$/i, '');
    let title   = slug;
    let excerpt = '';
    const dateISO = extractDateFromName(file.name);

    try {
      // download_url = raw.githubusercontent.com — не тратит лимит GitHub API
      const r = await fetch(file.download_url, { cache: 'no-store' });
      if (r.ok) {
        const md = await r.text();
        title   = extractTitle(md) || title;
        excerpt = makeExcerpt(md);
      }
    } catch (_) { /* оставляем slug в качестве заголовка */ }

    const card = document.createElement('a');
    card.className = 'post-card';
    card.href = 'post.html?p=' + encodeURIComponent(slug);
    card.innerHTML = `
      <div class="post-header">
        ${dateISO ? `<span class="post-date">${formatDate(dateISO)}</span>` : ''}
        <h2 class="post-title">${escapeHtml(title)}</h2>
      </div>
      <p class="post-excerpt">${escapeHtml(excerpt)}</p>
      <span class="read-more">Читать далее <span class="arrow">→</span></span>`;

    setTimeout(() => card.classList.add('visible'), 80 * i);

    card.addEventListener('click', function (e) {
      const rect = card.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
      card.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    });

    listEl.appendChild(card);
  }
}

loadPosts();
</script>
</body>
</html>
