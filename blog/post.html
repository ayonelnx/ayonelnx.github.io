<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пост</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
  :root {
    --accent: #6ee7b7;
    --accent2: #34d399;
    --accent-rgb: 110, 231, 183;
    --text: #e6f2ec;
    --muted: #93a89c;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.11);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: #0b0d17;
  }

  /* ---------- animated mesh background (green) ---------- */
  .bg-svg {
    position: fixed; inset: 0;
    z-index: -2;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-svg svg { width: 100%; height: 100%; display: block; }
  .bg-svg .sw { transform-box: fill-box; transform-origin: center; will-change: transform; }
  .bg-svg .sw1 { animation: sw1 20s ease-in-out infinite; }
  .bg-svg .sw2 { animation: sw2 24s ease-in-out infinite; }
  .bg-svg .sw3 { animation: sw3 28s ease-in-out infinite; }
  .bg-svg .sw4 { animation: sw4 22s ease-in-out infinite; }
  @keyframes sw1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(70px,-50px) scale(1.12); }
    66%      { transform: translate(-40px,60px) scale(0.93); }
  }
  @keyframes sw2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(-80px,40px) scale(1.1); }
    66%      { transform: translate(60px,-60px) scale(0.95); }
  }
  @keyframes sw3 {
    0%, 100% { transform: translate(0,0) scale(1) rotate(0deg); }
    33%      { transform: translate(60px,55px) scale(1.08) rotate(6deg); }
    66%      { transform: translate(-55px,-45px) scale(0.93) rotate(-6deg); }
  }
  @keyframes sw4 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(-65px,70px) scale(1.13); }
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(4, 12, 10, 0.42);
    backdrop-filter: blur(2px);
    z-index: -1;
  }

  .container { max-width: 780px; margin: 0 auto; padding: 50px 20px 80px; }

  .loader { text-align: center; padding: 120px 0; }
  .loader span {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); margin: 0 6px;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .loader span:nth-child(2) { animation-delay: 0.15s; background: var(--accent2); }
  .loader span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1.15); opacity: 1; } }

  .error-box { text-align: center; padding: 80px 0; color: var(--muted); animation: fadeUp 0.5s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  /* ---------- back button (redesigned) ---------- */
  .back-btn {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--text); text-decoration: none; font-weight: 600;
    font-size: 0.95rem;
    padding: 11px 22px; border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    transition: color 0.3s, border-color 0.3s, transform 0.25s, box-shadow 0.3s;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    animation: fadeDown 0.5s ease both;
  }
  .back-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 0% 50%, rgba(var(--accent-rgb), 0.22), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  .back-btn:hover {
    color: var(--accent);
    border-color: rgba(var(--accent-rgb), 0.55);
    transform: translateX(-4px);
    box-shadow: 0 10px 30px rgba(var(--accent-rgb), 0.22);
  }
  .back-btn:hover::before { opacity: 1; }
  .back-btn:active { transform: translateX(-2px) scale(0.98); }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }

  /* ---------- article card ---------- */
  article {
    margin-top: 30px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 44px 46px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: articleIn 0.7s 0.15s cubic-bezier(.22,.9,.3,1) both;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  @keyframes articleIn { from { opacity: 0; transform: translateY(40px) scale(0.98); } to { opacity: 1; transform: none; } }

  .post-date {
    display: inline-block; font-size: 0.85rem; color: var(--muted);
    background: rgba(255,255,255,0.06);
    padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .content h1 { font-size: 2rem; margin-bottom: 6px; line-height: 1.25; }
  .content h2 { font-size: 1.5rem; margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .content h3 { font-size: 1.2rem; margin: 26px 0 10px; }
  .content p  { margin: 14px 0; line-height: 1.75; color: #d6e3dc; }
  .content a  {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px dashed rgba(var(--accent-rgb), 0.65);
    transition: color 0.2s, border-color 0.2s;
  }
  .content a:hover { color: var(--accent2); border-bottom-color: var(--accent2); }
  .content strong { color: #fff; }
  .content ul, .content ol { margin: 14px 0 14px 26px; line-height: 1.7; color: #d6e3dc; }
  .content li { margin: 6px 0; }
  .content blockquote {
    margin: 18px 0; padding: 14px 20px;
    border-left: 3px solid var(--accent);
    background: rgba(var(--accent-rgb), 0.09);
    border-radius: 0 10px 10px 0;
    color: var(--muted); font-style: italic;
  }
  .content code {
    background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 6px;
    font-family: 'Consolas', 'Fira Code', monospace; font-size: 0.9em;
    border: 1px solid var(--border); color: #ffe08a;
  }
  .content pre {
    margin: 18px 0; padding: 18px 20px; overflow-x: auto;
    background: rgba(0,0,0,0.45); border: 1px solid var(--border);
    border-radius: 12px; line-height: 1.6;
  }
  .content pre code { background: none; border: none; padding: 0; color: #b8f2d0; }
  .content img { max-width: 100%; border-radius: 12px; margin: 16px 0; border: 1px solid var(--border); }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  .content table { border-collapse: collapse; margin: 18px 0; width: 100%; }
  .content th, .content td { border: 1px solid var(--border); padding: 9px 14px; }
  .content th { background: rgba(var(--accent-rgb), 0.12); }

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(var(--accent-rgb), 0.25);
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), 0.45); }

  @media (max-width: 600px) { article { padding: 28px 22px; } }
</style>
<base target="_blank">
</head>
<body>
<!-- ===== animated green mesh background ===== -->
<div class="bg-svg" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
        <feGaussianBlur stdDeviation="168" />
      </filter>
      <filter id="noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
        <feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
      </filter>
    </defs>
    <rect id="background" width="100%" height="100%" fill="#000" />
    <g id="swatches" filter="url(#blur)">
      <rect class="sw sw1" x="201.72421208408113" y="-146.4527952344053"  width="342.921944443973"   height="582.5629641032037"  fill="#09533f" />
      <rect class="sw sw2" x="289.1231513839648"  y="133.17153406167108" width="341.3269880922901"  height="405.58624760268276" fill="#1cf936" />
      <rect class="sw sw3" x="456.6570866263271"  y="259.5834516989205"  width="415.19998894386384" height="301.29288642421477" fill="#bab20c" />
      <rect class="sw sw4" x="389.01795344038504" y="-5.556255178521042" width="361.29726427563185" height="331.62150029313995" fill="#258820" />
    </g>
    <rect x="0" y="0" width="1000" height="500" style="mix-blend-mode: luminosity; filter: url(#noise); opacity: 0%"></rect>
  </svg>
</div>

<div class="container">
  <a class="back-btn" href="index.html">← Назад к постам</a>
  <div id="loader" class="loader"><span></span><span></span><span></span></div>
  <article id="article" style="display:none;">
    <span class="post-date" id="post-date"></span>
    <div class="content" id="content"></div>
  </article>
</div>

<script>
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMarkdown(md) {
  var codeBlocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
    codeBlocks.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
    return '\u0001CB' + (codeBlocks.length - 1) + '\u0001';
  });
  md = md.replace(/`([^`\n]+)`/g, function (m, c) {
    return '\u0001IC' + escapeHtml(c) + '\u0001';
  });

  var lines = md.split('\n');
  var html = '', inList = null, para = [], inBlockquote = false;

  function inline(s) {
    s = escapeHtml(s);
    s = s.replace(/\u0001IC(.*?)\u0001/g, '<code>$1</code>');
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s;
  }
  function flushPara() { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } }
  function closeList() { if (inList) { html += '</' + inList + '>'; inList = null; } }
  function flushQuote() { if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; } }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].replace(/\s+$/, '');
    var t = line.trim();
    var m;

    m = t.match(/^\u0001CB(\d+)\u0001$/);
    if (m) { flushPara(); closeList(); flushQuote(); html += codeBlocks[+m[1]]; continue; }
    if (/^(---+|\*\*\*+)$/.test(t)) { flushPara(); closeList(); flushQuote(); html += '<hr>'; continue; }
    if ((m = t.match(/^(#{1,6})\s+(.*)/))) {
      flushPara(); closeList(); flushQuote();
      var lvl = m[1].length;
      html += '<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>';
      continue;
    }
    if ((m = t.match(/^[-*]\s+(.*)/))) {
      flushPara(); flushQuote();
      if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
      html += '<li>' + inline(m[1]) + '</li>';
      continue;
    }
    if ((m = t.match(/^\d+\.\s+(.*)/))) {
      flushPara(); flushQuote();
      if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
      html += '<li>' + inline(m[1]) + '</li>';
      continue;
    }
    if ((m = t.match(/^>\s?(.*)/))) {
      flushPara(); closeList();
      if (!inBlockquote) { html += '<blockquote>'; inBlockquote = true; }
      html += '<p>' + inline(m[1]) + '</p>';
      continue;
    }
    if (t === '') { flushPara(); closeList(); flushQuote(); continue; }
    para.push(t);
  }
  flushPara(); closeList(); flushQuote();
  return html;
}

function formatDate(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function loadPost() {
  var params = new URLSearchParams(location.search);
  var slug = params.get('p');
  var loader = document.getElementById('loader');
  var article = document.getElementById('article');

  if (!slug) { showError('Не указан пост (?p=имя_файла)'); return; }

  var md = null, date = '';
  try {
    var r = await fetch('posts/' + slug + '.md', { cache: 'no-store' });
    if (r.ok) md = await r.text();
  } catch (e) {}

  try {
    var r2 = await fetch('posts.json', { cache: 'no-store' });
    if (r2.ok) {
      var manifest = await r2.json();
      var meta = manifest.find(function (e) {
        return e.file.toLowerCase() === (slug + '.md').toLowerCase() || e.file.toLowerCase() === slug.toLowerCase();
      });
      if (meta) date = meta.date;
    }
  } catch (e) {}

  loader.style.display = 'none';

  if (md === null) { showError('Пост «' + slug + '» не найден'); return; }

  document.getElementById('content').innerHTML = renderMarkdown(md);
  var dateEl = document.getElementById('post-date');
  if (date) dateEl.textContent = formatDate(date);
  else dateEl.style.display = 'none';

  var h1 = md.match(/^#\s+(.+)$/m);
  if (h1) document.title = h1[1].trim() + ' — Блог';

  article.style.display = 'block';
}

function showError(msg) {
  document.getElementById('loader').style.display = 'none';
  var el = document.createElement('div');
  el.className = 'error-box';
  el.innerHTML = '<p style="font-size:1.3rem;margin-bottom:16px;">' + escapeHtml(msg) + '</p>' +
                 '<a class="back-btn" href="index.html">← Вернуться к списку</a>';
  document.querySelector('.container').appendChild(el);
}

loadPost();
</script>
</body>
</html>
