<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f131c">
<title>Захвати цыгана</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#0f131c;
    font-family:'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  #app{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%; touch-action:none;}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0;
    padding:calc(12px + env(safe-area-inset-top)) 16px 0;
    z-index:5; pointer-events:none; display:none;
  }
  #timerWrap{
    height:14px; border-radius:99px;
    background:rgba(255,255,255,.10);
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  }
  #timerBar{
    height:100%; width:100%; border-radius:99px;
    background:#3ddc84;
    transition:width .08s linear, background .3s ease;
  }
  #status{
    margin-top:8px; text-align:center;
    font-weight:800; font-size:15px; letter-spacing:.6px;
    color:#e8eefc; text-shadow:0 2px 10px rgba(0,0,0,.75);
  }
  #status.danger{color:#ff6b6b; animation:pulse .55s infinite alternate;}
  @keyframes pulse{from{transform:scale(1);} to{transform:scale(1.07);}}

  /* ---------- Overlay ---------- */
  #overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
    background:rgba(6,9,16,.74);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    overflow-y:auto;
  }
  #overlay.show{opacity:1; pointer-events:auto;}

  .card{
    width:100%; max-width:540px;
    background:linear-gradient(160deg,#1d2436 0%,#12151f 100%);
    border:2px solid #2f3b57;
    border-radius:22px;
    padding:26px 22px 22px;
    color:#e8eefc; text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.65);
    animation:pop .3s cubic-bezier(.2,1.4,.5,1);
    margin:auto;
  }
  @keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}

  .emoji-row{font-size:38px; letter-spacing:8px; margin-bottom:6px;}

  .card h1{
    margin:6px 0 14px;
    font-size:clamp(22px,6vw,32px);
    letter-spacing:1px;
    background:linear-gradient(90deg,#ffd166,#ff7a45,#ff4d6d);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    font-weight:900;
  }
  .card.win h1{background:linear-gradient(90deg,#3ddc84,#8ef0a5,#3ddc84);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .card.lose h1{background:linear-gradient(90deg,#ff4d4d,#ff8a5b,#ff4d4d);
    -webkit-background-clip:text; background-clip:text; color:transparent;}

  .story{
    font-size:clamp(14px,3.7vw,16px);
    line-height:1.55; color:#c3cde3; margin:0 0 18px;
  }
  .story b{color:#ffd166;}

  .stat{font-size:15px; color:#9fb0d0; margin:0 0 16px;}
  .stat b{color:#3ddc84;}

  button{
    font-family:inherit; font-weight:900; letter-spacing:1px;
    font-size:clamp(15px,4vw,17px);
    padding:15px 26px; width:100%;
    border:none; border-radius:14px; cursor:pointer;
    color:#101725;
    background:linear-gradient(180deg,#ffd166,#ffab2e);
    box-shadow:0 8px 0 #b9761a, 0 14px 26px rgba(255,171,46,.25);
    transition:transform .08s ease, box-shadow .08s ease;
    touch-action:manipulation;
  }
  button:active{
    transform:translateY(5px);
    box-shadow:0 3px 0 #b9761a, 0 6px 14px rgba(255,171,46,.2);
  }

  .hint{margin:14px 0 0; font-size:12.5px; color:#7f8dab; line-height:1.5;}
  .disclaimer{margin:12px 0 0; font-size:11.5px; color:#5d6884; letter-spacing:.5px;}

  .news{
    background:#0b0f18; border:1px solid #2a3348;
    border-radius:14px; padding:14px; margin:0 0 18px; text-align:left;
  }
  .news-tag{
    display:inline-block; font-size:11px; font-weight:900; letter-spacing:1px;
    color:#fff; background:#e5383b; padding:3px 9px; border-radius:6px;
    margin-bottom:9px; animation:pulse .8s infinite alternate;
  }
  .news-title{font-weight:900; font-size:15px; color:#ff6b6b; margin-bottom:6px; line-height:1.35;}
  .news-text{font-size:13px; color:#8b98b5; line-height:1.45;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="timerWrap"><div id="timerBar"></div></div>
    <div id="status">Поймай цыгана!</div>
  </div>

  <div id="overlay"></div>
</div>

<script>
(function(){
  'use strict';

  // ======================= ИНИЦИАЛИЗАЦИЯ =======================
  const canvas   = document.getElementById('game');
  const ctx      = canvas.getContext('2d');
  const overlay  = document.getElementById('overlay');
  const hud      = document.getElementById('hud');
  const timerBar = document.getElementById('timerBar');
  const statusEl = document.getElementById('status');

  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color",sans-serif';
  const TIME_LIMIT = 30;

  let W = 0, H = 0, DPR = 1;

  const state = {
    mode: 'intro',          // intro | play | win | lose
    t: 0,
    timeLeft: TIME_LIMIT,
    unit: 1,
    player:  { x:0, y:0, r:20, vx:0, vy:0, dustTimer:0 },
    gypsy:   { x:0, y:0, r:19, vx:0, vy:0, pause:0, seed:0 },
    obstacles: [],
    particles: [],
    keys: {},
    pointer: { active:false, x:0, y:0 },
    shake: 0
  };

  // ======================= РАЗМЕРЫ =======================
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    state.unit = Math.min(W, H) / 600;

    if(state.mode === 'play' || state.mode === 'win' || state.mode === 'lose'){
      clampEntity(state.player);
      clampEntity(state.gypsy);
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize, 120));

  function clampEntity(c){
    if(!c) return;
    c.x = Math.max(c.r, Math.min(W - c.r, c.x));
    c.y = Math.max(c.r, Math.min(H - c.r, c.y));
  }

  // ======================= УТИЛИТЫ =======================
  function roundRect(x, y, w, h, r){
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  function resolveCircleRect(c, o){
    const nx = Math.max(o.x, Math.min(c.x, o.x + o.w));
    const ny = Math.max(o.y, Math.min(c.y, o.y + o.h));
    let dx = c.x - nx, dy = c.y - ny;
    const d2 = dx*dx + dy*dy;
    if(d2 > c.r * c.r) return;

    let d = Math.sqrt(d2);
    if(d < 0.0001){
      // центр внутри прямоугольника — выталкиваем к ближайшей стороне
      const left  = c.x - o.x;
      const right = (o.x + o.w) - c.x;
      const top   = c.y - o.y;
      const bot   = (o.y + o.h) - c.y;
      const m = Math.min(left, right, top, bot);
      if(m === left)       c.x = o.x - c.r;
      else if(m === right) c.x = o.x + o.w + c.r;
      else if(m === top)   c.y = o.y - c.r;
      else                 c.y = o.y + o.h + c.r;
      return;
    }
    const push = c.r - d;
    c.x += (dx / d) * push;
    c.y += (dy / d) * push;
  }

  // ======================= ГЕНЕРАЦИЯ УРОВНЯ =======================
  function makeObstacles(u){
    const list = [];
    const dw = 96 * u, dh = 64 * u;
    const startP = { x: W * 0.5, y: H * 0.82 };
    const startG = { x: W * 0.5, y: H * 0.28 };
    const pad = 70 * u;

    for(let i = 0; i < 4; i++){
      for(let attempt = 0; attempt < 80; attempt++){
        const x = (0.14 + Math.random() * 0.72) * W - dw / 2;
        const y = (0.26 + Math.random() * 0.48) * H - dh / 2;
        const r = { x, y, w: dw, h: dh };

        if(x < 8 || y < 8 || x + dw > W - 8 || y + dh > H - 8) continue;

        const cx = x + dw / 2, cy = y + dh / 2;
        if(Math.hypot(cx - startP.x, cy - startP.y) < pad * 2.2) continue;
        if(Math.hypot(cx - startG.x, cy - startG.y) < pad * 2.2) continue;

        let clash = false;
        for(const o of list){
          if(x < o.x + o.w + pad && x + dw + pad > o.x &&
             y < o.y + o.h + pad && y + dh + pad > o.y){ clash = true; break; }
        }
        if(clash) continue;

        list.push(r);
        break;
      }
    }
    return list;
  }

  // ======================= СТАРТ / КОНЕЦ =======================
  function newGame(){
    state.unit = Math.min(W, H) / 600;
    const u = state.unit;

    state.timeLeft = TIME_LIMIT;
    state.t = 0;
    state.particles = [];
    state.shake = 0;
    state.pointer.active = false;

    state.player = {
      x: W * 0.5, y: Math.min(H * 0.82, H - 90 * u),
      r: 20 * u, vx: 0, vy: 0, dustTimer: 0
    };
    state.gypsy = {
      x: W * 0.5, y: Math.max(H * 0.26, 90 * u),
      r: 19 * u, vx: 0, vy: 0, pause: 0, seed: Math.random() * 10
    };

    state.obstacles = makeObstacles(u);
  }

  function startGame(){
    resize();
    newGame();
    state.mode = 'play';
    hud.style.display = 'block';
    hideOverlay();
    updateTimerUI();
  }

  function win(){
    if(state.mode !== 'play') return;
    state.mode = 'win';
    hud.style.display = 'none';

    for(let i = 0; i < 70; i++){
      state.particles.push({
        x: Math.random() * W,
        y: -30 - Math.random() * H * 0.4,
        vx: (Math.random() - 0.5) * 140,
        vy: 120 + Math.random() * 240,
        life: 3, max: 3,
        r: 4 + Math.random() * 6,
        color: 'hsl(' + Math.floor(Math.random() * 360) + ',90%,62%)'
      });
    }

    const left = state.timeLeft.toFixed(1);
    showOverlay(
      '<div class="card win">' +
        '<div class="emoji-row">🏆 🕺 🤝</div>' +
        '<h1>ПОЗОР ПРЕДОТВРАЩЁН!</h1>' +
        '<p class="story">Ты догнал цыгана и остановил драку!<br>' +
        'Физрук выдохнул, директриса улыбается, а школа <b>не попала в новости</b>. 🎉</p>' +
        '<p class="stat">Осталось времени: <b>' + left + ' с</b></p>' +
        '<button data-action="restart">ЕЩЁ РАЗ</button>' +
        '<p class="disclaimer">Игра создана в юмористических целях 🎈</p>' +
      '</div>'
    );
  }

  function lose(){
    if(state.mode !== 'play') return;
    state.mode = 'lose';
    hud.style.display = 'none';
    state.shake = 1;

    showOverlay(
      '<div class="card lose">' +
        '<div class="emoji-row">😱 📰 🏫</div>' +
        '<h1>ПОЗОР!</h1>' +
        '<p class="story">Ты не успел! Цыган начал драку...<br>' +
        'Физрук в шоке, директриса плачет.</p>' +
        '<div class="news">' +
          '<div class="news-tag">🔴 СРОЧНО</div>' +
          '<div class="news-title">ШКОЛА ЗАСВЕТИЛАСЬ В НОВОСТЯХ</div>' +
          '<div class="news-text">«Мы стали позорниками» — комментируют ученики на перемене.</div>' +
        '</div>' +
        '<button data-action="restart">ПОПРОБОВАТЬ СНОВА</button>' +
        '<p class="disclaimer">Игра создана в юмористических целях 🎈</p>' +
      '</div>'
    );
  }

  // ======================= ОВЕРЛЕЙ =======================
  function showOverlay(html){
    overlay.innerHTML = html;
    overlay.classList.add('show');
  }
  function hideOverlay(){
    overlay.classList.remove('show');
  }

  overlay.addEventListener('click', function(e){
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const a = btn.dataset.action;
    if(a === 'start' || a === 'restart') startGame();
  });

  function showIntro(){
    state.mode = 'intro';
    hud.style.display = 'none';
    showOverlay(
      '<div class="card">' +
        '<div class="emoji-row">🕺 📱 🏃</div>' +
        '<h1>ЗАХВАТИ ЦЫГАНА</h1>' +
        '<p class="story">' +
          'Перемена. Цыган сидит в телефоне и играет. Ты подошёл и достал его — ' +
          'и тут же завязалась драка!<br><br>' +
          'Теперь у тебя <b>30 секунд</b>, чтобы догнать цыгана и остановить драку. ' +
          'Не успеешь — физруку и директрисе не поздоровится, ' +
          'а школа попадёт в новости...' +
        '</p>' +
        '<button data-action="start">НАЧАТЬ ПОГОНЮ</button>' +
        '<p class="hint">💻 ПК: WASD или стрелки &nbsp;·&nbsp; 📱 Телефон: веди пальцем по экрану</p>' +
        '<p class="disclaimer">Игра создана в юмористических целях 🎈</p>' +
      '</div>'
    );
  }

  // ======================= УПРАВЛЕНИЕ =======================
  window.addEventListener('keydown', function(e){
    state.keys[e.code] = true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) !== -1){
      e.preventDefault();
    }
    if(e.code === 'Enter' || e.code === 'Space'){
      if(state.mode === 'intro' || state.mode === 'win' || state.mode === 'lose'){
        startGame();
      }
    }
  });
  window.addEventListener('keyup', function(e){ state.keys[e.code] = false; });
  window.addEventListener('blur', function(){ state.keys = {}; state.pointer.active = false; });

  canvas.addEventListener('pointerdown', function(e){
    if(state.mode !== 'play') return;
    state.pointer.active = true;
    state.pointer.x = e.clientX;
    state.pointer.y = e.clientY;
    if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function(e){
    if(state.mode !== 'play' || !state.pointer.active) return;
    state.pointer.x = e.clientX;
    state.pointer.y = e.clientY;
    e.preventDefault();
  });
  function endPointer(){ state.pointer.active = false; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ======================= ЛОГИКА =======================
  function updatePlayer(dt){
    const p = state.player, u = state.unit, k = state.keys;
    let ix = 0, iy = 0;

    if(k['KeyA'] || k['ArrowLeft'])  ix -= 1;
    if(k['KeyD'] || k['ArrowRight']) ix += 1;
    if(k['KeyW'] || k['ArrowUp'])    iy -= 1;
    if(k['KeyS'] || k['ArrowDown'])  iy += 1;

    if(state.pointer.active){
      const dx = state.pointer.x - p.x;
      const dy = state.pointer.y - p.y;
      const d = Math.hypot(dx, dy);
      if(d > 8 * u){ ix += dx / d; iy += dy / d; }
    }

    const m = Math.hypot(ix, iy);
    if(m > 1){ ix /= m; iy /= m; }

    const speed = 435 * u;
    const acc = Math.min(1, dt * 13);
    p.vx += (ix * speed - p.vx) * acc;
    p.vy += (iy * speed - p.vy) * acc;

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.x = Math.max(p.r, Math.min(W - p.r, p.x));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y));

    for(let i = 0; i < state.obstacles.length; i++){
      resolveCircleRect(p, state.obstacles[i]);
    }
    clampEntity(p);

    // пыль из-под ног
    const spd = Math.hypot(p.vx, p.vy);
    p.dustTimer -= dt;
    if(spd > 90 * u && p.dustTimer <= 0){
      p.dustTimer = 0.055;
      state.particles.push({
        x: p.x + (Math.random() - 0.5) * p.r,
        y: p.y + p.r * 0.7,
        vx: (Math.random() - 0.5) * 50,
        vy: (Math.random() - 0.5) * 50 - 15,
        life: 0.5, max: 0.5,
        r: (4 + Math.random() * 6) * u,
        color: 'rgba(150,180,255,0.45)'
      });
    }
  }

  function updateGypsy(dt){
    const g = state.gypsy, p = state.player, u = state.unit;

    let dx = g.x - p.x, dy = g.y - p.y;
    let dist = Math.hypot(dx, dy) || 1;
    dx /= dist; dy /= dist;

    if(g.pause > 0){
      g.pause -= dt;
      g.vx *= 0.88;
      g.vy *= 0.88;
    } else {
      // убегаем + петляем
      const strafe = Math.sin(state.t * 2.7 + g.seed) * 0.85;
      const px = -dy, py = dx;
      let dvx = dx + px * strafe;
      let dvy = dy + py * strafe;

      // отталкивание от краёв
      const margin = 95 * u;
      if(g.x < margin)         dvx += (1 - g.x / margin) * 1.8;
      if(g.x > W - margin)     dvx -= (1 - (W - g.x) / margin) * 1.8;
      if(g.y < margin)         dvy += (1 - g.y / margin) * 1.8;
      if(g.y > H - margin)     dvy -= (1 - (H - g.y) / margin) * 1.8;

      const mm = Math.hypot(dvx, dvy) || 1;
      dvx /= mm; dvy /= mm;

      const speed = 352 * u;
      const acc = Math.min(1, dt * 7);
      g.vx += (dvx * speed - g.vx) * acc;
      g.vy += (dvy * speed - g.vy) * acc;

      // иногда останавливается — залипает в телефон
      if(dist > 130 * u && Math.random() < dt * 0.16){
        g.pause = 0.55 + Math.random() * 0.7;
      }
    }

    g.x += g.vx * dt;
    g.y += g.vy * dt;

    g.x = Math.max(g.r, Math.min(W - g.r, g.x));
    g.y = Math.max(g.r, Math.min(H - g.r, g.y));

    for(let i = 0; i < state.obstacles.length; i++){
      resolveCircleRect(g, state.obstacles[i]);
    }
    clampEntity(g);
  }

  function checkCatch(){
    const p = state.player, g = state.gypsy;
    const d = Math.hypot(p.x - g.x, p.y - g.y);
    if(d < p.r + g.r + 6 * state.unit){
      win();
    }
  }

  function updateParticles(dt){
    for(let i = state.particles.length - 1; i >= 0; i--){
      const pt = state.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += (pt.vy > 0 ? 220 : 0) * dt * 0.2;
      pt.life -= dt;
      if(pt.life <= 0) state.particles.splice(i, 1);
    }
  }

  function updateTimerUI(){
    const frac = Math.max(0, Math.min(1, state.timeLeft / TIME_LIMIT));
    timerBar.style.width = (frac * 100).toFixed(1) + '%';
    timerBar.style.background = frac > 0.5 ? '#3ddc84' : (frac > 0.25 ? '#ffc93c' : '#ff4d4d');

    const secs = Math.max(0, state.timeLeft);
    statusEl.textContent = 'Поймай цыгана! ' + secs.toFixed(1) + ' с';
    if(frac <= 0.2) statusEl.classList.add('danger');
    else statusEl.classList.remove('danger');
  }

  function update(dt){
    state.t += dt;

    if(state.mode === 'play'){
      state.timeLeft -= dt;
      if(state.timeLeft <= 0){
        state.timeLeft = 0;
        updateTimerUI();
        lose();
      } else {
        updatePlayer(dt);
        updateGypsy(dt);
        checkCatch();
        updateTimerUI();
      }
    }

    updateParticles(dt);

    if(state.shake > 0){
      state.shake = Math.max(0, state.shake - dt * 1.8);
    }
  }

  // ======================= РЕНДЕР =======================
  function drawBackground(){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a2130');
    g.addColorStop(1, '#0d1119');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const tile = 62 * state.unit;
    ctx.strokeStyle = 'rgba(255,255,255,0.042)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x = 0; x < W; x += tile){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for(let y = 0; y < H; y += tile){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // виньетка
    const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawObstacles(){
    const u = state.unit;
    for(let i = 0; i < state.obstacles.length; i++){
      const o = state.obstacles[i];

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 16 * u;
      ctx.shadowOffsetY = 7 * u;
      ctx.fillStyle = '#5a3d26';
      roundRect(o.x, o.y, o.w, o.h, 11 * u);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#8a6242';
      roundRect(o.x + 4 * u, o.y + 4 * u, o.w - 8 * u, o.h - 8 * u, 8 * u);
      ctx.fill();

      // книги на парте
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      roundRect(o.x + o.w * 0.18, o.y + o.h * 0.24, o.w * 0.3, o.h * 0.2, 3 * u);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,209,102,0.20)';
      roundRect(o.x + o.w * 0.55, o.y + o.h * 0.5, o.w * 0.24, o.h * 0.18, 3 * u);
      ctx.fill();
    }
  }

  function drawParticles(){
    for(let i = 0; i < state.particles.length; i++){
      const pt = state.particles[i];
      const a = Math.max(0, pt.life / pt.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color || 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * (0.35 + 0.65 * a), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCharacter(c, emoji, glowColor, flip){
    const u = state.unit;

    // тень
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + c.r * 0.9, c.r * 0.85, c.r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // свечение
    const grad = ctx.createRadialGradient(c.x, c.y, c.r * 0.3, c.x, c.y, c.r * 1.7);
    grad.addColorStop(0, glowColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r * 1.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // эмодзи
    ctx.save();
    ctx.translate(c.x, c.y);
    if(flip) ctx.scale(-1, 1);
    ctx.font = (c.r * 2.25).toFixed(1) + 'px ' + EMOJI_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 0, 0);
    ctx.restore();
  }

  function drawGypsy(){
    const g = state.gypsy, u = state.unit;
    drawCharacter(g, '🕺', '#ff7a45', false);

    if(g.pause > 0){
      const bob = Math.sin(state.t * 11) * 3.5 * u;
      ctx.font = (g.r * 1.35).toFixed(1) + 'px ' + EMOJI_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📱', g.x, g.y - g.r * 1.85 + bob);
    }
  }

  function drawPlayer(){
    const p = state.player, u = state.unit;
    drawCharacter(p, '🏃', '#4da3ff', p.vx < -25 * u);
  }

  function drawPointer(){
    if(!state.pointer.active || state.mode !== 'play') return;
    const u = state.unit;
    const r = 20 * u;
    ctx.beginPath();
    ctx.arc(state.pointer.x, state.pointer.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(77,163,255,0.55)';
    ctx.lineWidth = 3 * u;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(state.pointer.x, state.pointer.y, r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(77,163,255,0.55)';
    ctx.fill();
  }

  function render(){
    ctx.save();

    if(state.shake > 0){
      const s = state.shake * 14;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    drawBackground();
    drawObstacles();
    drawParticles();
    drawGypsy();
    drawPlayer();
    drawPointer();

    ctx.restore();
  }

  // ======================= ЦИКЛ =======================
  let lastTime = performance.now();
  function loop(now){
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if(dt > 0.05) dt = 0.05;   // защита от лагов
    if(dt < 0)    dt = 0;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  // ======================= ЗАПУСК =======================
  resize();
  showIntro();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
