<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', sans-serif;
            background: linear-gradient(180deg, #1a0f0a 0%, #2d1a12 50%, #3d2418 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
        }

        .profile-card {
            background: rgba(33, 33, 33, 0.8);
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            display: flex;
            gap: 40px;
            align-items: flex-start;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: cardAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            position: relative;
            z-index: 1;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .avatar-section {
            flex-shrink: 0;
            opacity: 0;
            transform: scale(0.8);
            animation: avatarAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
        }

        @keyframes avatarAppear {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .info-section {
            flex: 1;
            color: #ffffff;
        }

        .name {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.5s ease 0.4s forwards;
        }

        .name .highlight {
            color: #ff8c42;
	    font-size: 32px;
        }

        .info-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            color: #e0e0e0;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.5s ease forwards;
        }

        .info-item:nth-child(1) { animation-delay: 0.5s; }
        .info-item:nth-child(2) { animation-delay: 0.6s; }
        .info-item:nth-child(3) { animation-delay: 0.7s; }
        .info-item:nth-child(4) { animation-delay: 0.8s; }
        .info-item:nth-child(5) { animation-delay: 0.9s; }
        .info-item:nth-child(6) { animation-delay: 1.0s; }
        .info-item:nth-child(7) { animation-delay: 1.1s; }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .info-item i {
            width: 24px;
            text-align: center;
            color: #ffffff;
            font-size: 18px;
        }

        .arch-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .arch-link:hover {
            color: #ff8c42;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            opacity: 0;
            transform: translateY(10px);
            animation: slideIn 0.5s ease 1.2s forwards;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 18px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .social-btn:hover::before {
            opacity: 1;
        }

        .social-btn.youtube {
            background: #ff4444;
        }

        .social-btn.telegram {
            background: #0088cc;
        }

        .social-btn.discord {
            background: #5865F2;
        }

        .social-btn:active {
            transform: translateY(-1px) scale(1.05);
        }

        @media (max-width: 640px) {
            .profile-card {
                flex-direction: column;
                align-items: center;
                padding: 30px 20px;
                gap: 30px;
            }

            .avatar {
                width: 150px;
                height: 150px;
            }

            .name {
                font-size: 28px;
                text-align: center;
            }

            .info-section {
                width: 100%;
            }

            .info-list {
                gap: 10px;
            }

            .info-item {
                font-size: 14px;
            }

            .social-links {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="avatar-section">
            <img src="https://raw.githubusercontent.com/ayonelnx/ayonelnx.github.io/refs/heads/main/ava.png" alt="Avatar" class="avatar">
        </div>
        
        <div class="info-section">
            <h1 class="name">Vidasik<span class="highlight"> &lt;/&gt;</span></h1>
            
            <ul class="info-list">
                <li class="info-item">
                    <i class="far fa-clock"></i>
                    <span>13 y.o.</span>
                </li>
                <li class="info-item">
                    <i class="far fa-map"></i>
                    <span>Belarus</span>
                </li>
                <li class="info-item">
                    <i class="fas fa-gamepad"></i>
                    <span>Linuxoid, Music, Design</span>
                </li>
                <li class="info-item">
                    <i class="fas fa-users"></i>
                    <span>Russian, English, Belarusian</span>
                </li>
                <li class="info-item">
                    <i class="fas fa-desktop"></i>
                    <a>
                        CachyOS + ReviOS 25H2
                    </a>
                </li>
                <li class="info-item">
                    <i class="fas fa-mobile-alt"></i>
                    <span>iPhone 13 · Redmi Note 8</span>
                </li>
                <li class="info-item">
                    <i class="fas fa-laptop"></i>
                    <span>Lenovo Ideapad Gaming 3 (82K2)</span>
                </li>
            </ul>

            <div class="social-links">
                <a href="https://youtube.com/@VidasikTCH" target="_blank" class="social-btn youtube" title="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://t.me/ayoneflnx" target="_blank" class="social-btn telegram" title="Telegram">
                    <i class="fab fa-telegram-plane"></i>
                </a>
                <a href="https://discord.gg/NzFtENBpgp" target="_blank" class="social-btn discord" title="Discord">
                    <i class="fab fa-discord"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.profile-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('.profile-card');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                ripple.style.background = 'rgba(255,255,255,0.5)';
                ripple.style.borderRadius = '50%';
                ripple.style.transform = 'translate(-50%, -50%)';
                ripple.style.pointerEvents = 'none';
                ripple.style.animation = 'ripple 0.6s ease-out';
                
                const rect = this.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                
                this.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            });
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    width: 100px;
                    height: 100px;
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
