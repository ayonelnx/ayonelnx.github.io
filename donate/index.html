<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пополнение TON</title>
  <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#09090c;
      --panel:#1a0f25;
      --panel-2:#21112e;
      --text:#ffffff;
      --muted:#9f95a9;
      --line:rgba(255,255,255,.1);
      --purple:#6f1dff;
      --purple-soft:rgba(122,32,255,.35);
      --blue:#1ea7ff;
      --blue-2:#1794e4;
      --success:#36d399;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Product Sans","Google Sans",system-ui,-apple-system,sans-serif;
      color:var(--text);
      background:
        radial-gradient(ellipse at 50% 88%, rgba(116,20,255,.55) 0%, rgba(86,15,184,.35) 22%, rgba(48,10,96,.14) 40%, rgba(0,0,0,0) 65%),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.025) 0 1px,
          rgba(0,0,0,.0) 1px 65px,
          rgba(0,0,0,.22) 65px 66px
        ),
        linear-gradient(180deg,#09090c 0%,#0b0a10 100%);
      min-height:00vh;
      overflow-x:hidden;
    }

    .ambient{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 65% 28%, rgba(115,0,255,.12), transparent 24%),
        radial-gradient(circle at 20% 75%, rgba(115,0,255,.1), transparent 18%),
        radial-gradient(circle at 80% 78%, rgba(115,0,255,.16), transparent 22%);
      filter: blur(20px);
      opacity:.9;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .card{
      width:min(985px,100%);
      min-height:620px;
      border-radius:38px;
      background:rgba(25,25,25,.8);
      position:relative;
      overflow:hidden;
      padding:42px 32px 32px;
      animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
      transform-origin:center center;
    }

    .card::after{
      content:"";
      position:absolute;
      inset:auto 10% -80px 10%;
      height:120px;
      background:radial-gradient(ellipse at center, rgba(112,24,255,.2), transparent 65%);
      filter:blur(20px);
      pointer-events:none;
    }

    .header{
      text-align:center;
      animation:fadeUp .9s .18s both;
    }

    .title{
      margin:0;
      font-size:58px;
      line-height:.98;
      letter-spacing:-0.03em;
      font-weight:700;
    }

    .subtitle{
      margin:14px 0 0;
      font-size:31px;
      color:var(--muted);
      line-height:1.1;
      font-weight:400;
    }

    .content{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      margin-top:92px;
      animation:fadeUp .9s .36s both;
    }

    .coin{
      width:136px;
      height:136px;
      border-radius:50%;
      background:linear-gradient(180deg,var(--blue),var(--blue-2));
      display:grid;
      place-items:center;
      box-shadow:
        0 20px 40px rgba(18,143,226,.22),
        inset 0 1px 0 rgba(255,255,255,.24);
      transition:transform .3s ease, box-shadow .3s ease;
    }

    .coin:hover{
      transform:translateY(-3px) scale(1.02);
      box-shadow:
        0 28px 50px rgba(18,143,226,.28),
        inset 0 1px 0 rgba(255,255,255,.3);
    }

    .ton-svg{
      width:72px;
      height:72px;
      display:block;
    }

    .network{
      margin-top:20px;
      font-size:33px;
      line-height:1;
      font-weight:700;
      letter-spacing:-0.03em;
    }

    .desc{
      margin-top:8px;
      font-size:18px;
      color:#f0edf5;
      opacity:.92;
    }

    .address-box{
      margin-top:22px;
      width:min(560px,100%);
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
    }

    .address-label{
      font-size:13px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .address-row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .address-link{
      flex:1 1 280px;
      min-width:0;
      text-decoration:none;
      color:#fff;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:14px 16px;
      font-size:15px;
      line-height:1.35;
      word-break:break-all;
      transition:background .2s ease,border-color .2s ease,transform .2s ease;
    }

    .address-link:hover,
    .address-link:focus{
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.16);
      outline:none;
    }

    .btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.025);
      color:#fff;
      border-radius:10px;
      height:46px;
      padding:0 16px;
      font-size:15px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      cursor:pointer;
      transition:transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
      white-space:nowrap;
      user-select:none;
    }

    .btn:hover{
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.18);
    }

    .btn:active{
      transform:scale(.98);
    }

    .btn.success{
      border-color:rgba(54,211,153,.35);
      color:#d9fff1;
      background:rgba(54,211,153,.12);
    }

    .copy-inline{
      margin-top:14px;
      animation:fadeUp .9s .52s both;
    }

    .copy-icon{
      width:20px;
      height:20px;
      position:relative;
      display:inline-block;
    }

    .copy-icon::before,
    .copy-icon::after{
      content:"";
      position:absolute;
      border:2px solid currentColor;
      border-radius:3px;
      width:12px;
      height:12px;
    }

    .copy-icon::before{
      left:6px; top:6px;
    }

    .copy-icon::after{
      left:0; top:0;
      background:transparent;
    }

    .hint{
      margin-top:14px;
      color:var(--muted);
      font-size:14px;
      text-align:center;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translateX(-50%) translateY(20px);
      background:rgba(20,16,28,.92);
      color:#fff;
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px;
      padding:12px 16px;
      box-shadow:0 15px 40px rgba(0,0,0,.35);
      opacity:0;
      pointer-events:none;
      transition:all .28s ease;
      z-index:10;
      font-size:14px;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @keyframes cardIn{
      from{opacity:0; transform:translateY(28px) scale(.965)}
      to{opacity:1; transform:translateY(0) scale(1)}
    }

    @keyframes fadeUp{
      from{opacity:0; transform:translateY(18px)}
      to{opacity:1; transform:translateY(0)}
    }

    @media (max-width: 900px){
      .card{
        min-height:auto;
        padding:34px 20px 24px;
        border-radius:28px;
      }
      .title{font-size:42px}
      .subtitle{font-size:24px}
      .content{margin-top:64px}
      .network{font-size:28px}
    }

    @media (max-width: 560px){
      .wrap{padding:16px}
      .title{font-size:34px}
      .subtitle{font-size:20px}
      .coin{width:112px;height:112px}
      .ton-svg{width:60px;height:60px}
      .address-row{flex-direction:column}
      .address-link,.btn{width:100%}
      .network{font-size:24px}
      .desc{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="ambient"></div>

  <main class="wrap">
    <section class="card">
      <header class="header">
        <h1 class="title">Закинь денюжку</h1>
        <p class="subtitle">Пока только криптовалютой.</p>
      </header>

      <div class="content">
        <div class="coin" aria-hidden="true">
          <svg class="ton-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M16.5 13H47.5C50.7 13 52.55 16.56 50.72 19.17L35.22 41.31C33.64 43.56 30.36 43.56 28.78 41.31L13.28 19.17C11.45 16.56 13.3 13 16.5 13Z" stroke="white" stroke-width="4.2" stroke-linejoin="round"/>
            <path d="M25 13L32 41.5L39 13" stroke="white" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="network">Сеть TON</div>
        <div class="desc">Только GRAM и USDT</div>

        <div class="address-box">
          <div class="address-label">Адрес кошелька</div>
          <div class="address-row">
            <a class="address-link" id="walletLink" href="ton://transfer/UQDDr1KkuctTXqmlOOf160RlFaiAwvCPuqmNsnzujgkg6KGp" title="Открыть в TON-кошельке">
              UQDDr1KkuctTXqmlOOf160RlFaiAwvCPuqmNsnzujgkg6KGp
            </a>
            <button class="btn" id="copyBtn" type="button">
              <span class="copy-icon" aria-hidden="true"></span>
              <span id="copyText">Скопировать</span>
            </button>
          </div>
        </div>

        <div class="hint">Нажми на адрес, чтобы открыть кошелёк, или скопируй его.</div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Адрес скопирован</div>

  <script>
    const walletAddress = 'UQDDr1KkuctTXqmlOOf160RlFaiAwvCPuqmNsnzujgkg6KGp';
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const toast = document.getElementById('toast');

    function showToast(text){
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function copyAddress(){
      try{
        await navigator.clipboard.writeText(walletAddress);
        copyBtn.classList.add('success');
        copyText.textContent = 'Скопировано';
        showToast('Адрес скопирован');
        setTimeout(() => {
          copyBtn.classList.remove('success');
          copyText.textContent = 'Скопировать';
        }, 1800);
      }catch(e){
        const area = document.createElement('textarea');
        area.value = walletAddress;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        copyBtn.classList.add('success');
        copyText.textContent = 'Скопировано';
        showToast('Адрес скопирован');
        setTimeout(() => {
          copyBtn.classList.remove('success');
          copyText.textContent = 'Скопировать';
        }, 1800);
      }
    }

    copyBtn.addEventListener('click', copyAddress);
  </script>
</body>
</html>
